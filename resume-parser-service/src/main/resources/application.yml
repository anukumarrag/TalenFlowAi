server:
  port: 8082

spring:
  application:
    name: resume-parser-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    url: jdbc:h2:mem:resumedb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true

langchain4j:
  open-ai:
    api-key: ${OPENAI_API_KEY:demo}
    model-name: gpt-3.5-turbo
