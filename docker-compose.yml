version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: talentflow-postgres
    environment:
      POSTGRES_DB: talentflow
      POSTGRES_USER: talentflow
      POSTGRES_PASSWORD: talentflow_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB for Resumes and Transcripts
  mongodb:
    image: mongo:7
    container_name: talentflow-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: talentflow
      MONGO_INITDB_ROOT_PASSWORD: talentflow_secret
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Kafka with KRaft
  kafka:
    image: apache/kafka:3.7.0
    container_name: talentflow-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: ../Dockerfile
      args:
        MODULE: api-gateway
    container_name: talentflow-api-gateway
    ports:
      - "8080:8080"
    environment:
      JD_GENERATOR_URI: http://jd-generator:8081
      RESUME_PARSER_URI: http://resume-parser:8082
      INTERVIEW_SERVICE_URI: http://interview-service:8083
      EVALUATION_SERVICE_URI: http://evaluation-service:8084
    depends_on:
      - jd-generator
      - resume-parser
      - interview-service
      - evaluation-service

  # JD Generator Service
  jd-generator:
    build:
      context: ./jd-generator-service
      dockerfile: ../Dockerfile
      args:
        MODULE: jd-generator-service
    container_name: talentflow-jd-generator
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/talentflow
      SPRING_DATASOURCE_USERNAME: talentflow
      SPRING_DATASOURCE_PASSWORD: talentflow_secret
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo}
    depends_on:
      postgres:
        condition: service_healthy

  # Resume Parser Service
  resume-parser:
    build:
      context: ./resume-parser-service
      dockerfile: ../Dockerfile
      args:
        MODULE: resume-parser-service
    container_name: talentflow-resume-parser
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/talentflow
      SPRING_DATASOURCE_USERNAME: talentflow
      SPRING_DATASOURCE_PASSWORD: talentflow_secret
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Interview Service
  interview-service:
    build:
      context: ./interview-service
      dockerfile: ../Dockerfile
      args:
        MODULE: interview-service
    container_name: talentflow-interview-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/talentflow
      SPRING_DATASOURCE_USERNAME: talentflow
      SPRING_DATASOURCE_PASSWORD: talentflow_secret
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo}
    depends_on:
      postgres:
        condition: service_healthy

  # Evaluation Service
  evaluation-service:
    build:
      context: ./evaluation-service
      dockerfile: ../Dockerfile
      args:
        MODULE: evaluation-service
    container_name: talentflow-evaluation-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/talentflow
      SPRING_DATASOURCE_USERNAME: talentflow
      SPRING_DATASOURCE_PASSWORD: talentflow_secret
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  mongodb_data:
